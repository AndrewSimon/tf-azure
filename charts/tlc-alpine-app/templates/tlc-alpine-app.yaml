{{ if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tlc-alpine-app.serviceAccountName" . }}
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}-configmap-writer-role
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}-configmap-writer-binding
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "tlc-alpine-app.fullname" . }}-configmap-writer-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "tlc-alpine-app.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}-tlc-alpine-app
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tlcAlpineApp.replicas }}
  selector:
    matchLabels:
      app: tlc-alpine-app
    {{- include "tlc-alpine-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: tlc-alpine-app
      {{- include "tlc-alpine-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: flux-system-redis
        - name: REDIS_HOST
          value: {{ quote .Values.tlcAlpineApp.app.env.redisHost }}
        - name: CONFIGMAP_NAME
          value: {{ quote .Values.tlcAlpineApp.app.env.configmapName }}
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.tlcAlpineApp.app.image.repository }}:{{ .Values.tlcAlpineApp.app.image.tag
          | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.tlcAlpineApp.app.imagePullPolicy }}
        name: app
        ports:
        - containerPort: 8080
        resources: {}
        volumeMounts:
        - mountPath: /index.html
          name: html-volume
          subPath: index.html
      - env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.tlcAlpineApp.nginx.image.repository }}:{{ .Values.tlcAlpineApp.nginx.image.tag
          | default .Chart.AppVersion }}
        name: nginx
        ports:
        - containerPort: 80
        resources: {}
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: html-volume
      nodeSelector: {{- toYaml .Values.tlcAlpineApp.nodeSelector | nindent 8 }}
      serviceAccountName: {{ include "tlc-alpine-app.serviceAccountName" . }}
      tolerations: {{- toYaml .Values.tlcAlpineApp.tolerations | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.tlcAlpineApp.topologySpreadConstraints
        | nindent 8 }}
      volumes:
      - configMap:
          name: {{ include "tlc-alpine-app.fullname" . }}-html-output-config
        name: html-volume
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}-tlc-alpine-ingress
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - http:
      paths:
      - backend:
          service:
            name: '{{ include "tlc-alpine-app.fullname" . }}-tlc-alpine-app'
            port:
              number: 80
        path: /
        pathType: Prefix
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}-tlc-alpine-app
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.tlcAlpineApp.type }}
  selector:
    app: tlc-alpine-app
    {{- include "tlc-alpine-app.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.tlcAlpineApp.ports | toYaml | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}-html-output-config
  labels:
  {{- include "tlc-alpine-app.labels" . | nindent 4 }}
data:
  index.html: {{ .Values.htmlOutputConfig.indexHtml | toYaml | indent 1 }}
