{{- if .Values.rbac.create }}
# RBAC: Create a ServiceAccount for the Python App
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.serviceAccountName | default (include "tlc-alpine-app.fullname" .) }}
  labels:
    app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
    helm.sh/chart: {{ include "tlc-alpine-app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
# RBAC: Define permissions to read and update ConfigMaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rbac.roleName | default (printf "%s-role" (include "tlc-alpine-app.fullname" .)) }}
  labels:
    app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
    helm.sh/chart: {{ include "tlc-alpine-app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
# RBAC: Bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rbac.bindingName | default (printf "%s-binding" (include "tlc-alpine-app.fullname" .)) }}
  labels:
    app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
    helm.sh/chart: {{ include "tlc-alpine-app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName | default (include "tlc-alpine-app.fullname" .) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.rbac.roleName | default (printf "%s-role" (include "tlc-alpine-app.fullname" .)) }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# ConfigMap for initial default template
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  labels:
    app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
    helm.sh/chart: {{ include "tlc-alpine-app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  index.html: |
{{ .Values.configMap.defaultHtml | indent 4 }}
---
# The Python App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tlc-alpine-app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
    helm.sh/chart: {{ include "tlc-alpine-app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tlc-alpine-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.rbac.serviceAccountName | default (include "tlc-alpine-app.fullname" .) }}
      containers:
        - name: app
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: {{ .Values.redis.secretKey }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: CONFIGMAP_NAME
              value: {{ .Values.configMap.name | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
          - name: html-volume
            mountPath: /index.html
            subPath: index.html
          ports:
          - containerPort: 8080        
        - name: nginx
          image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
          - name: html-volume
            mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: {{ .Values.configMap.name }}
---
# Service exposing Nginx container on port 80
apiVersion: v1
kind: Service
metadata:
  name: tlc-alpine-app
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: tlc-tlc-alpine-app
---
# Ingress Routing config
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tlc-alpine-ingress
  namespace: tlc
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tlc-alpine-app
            port:
              number: 80    