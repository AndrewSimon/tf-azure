htmlOutputConfig:
  indexHtml: |-
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TLC Alpine App</title>
        <style>
            body { font-family: sans-serif; background-color: #f4f4f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .card { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
            h1 { color: #0076ff; margin-bottom: 0.5rem; }
        </style>
    </head>
    <body>
        <h1>Hello from inside TLC Alpine App!</h1>
        <p>This HTML is still the default gh action/k8s deployment generated ConfigMap.</p>
        <p>The python generated configmap will take 1 to 2 minutes to sync automagically after container start, please be patient</p>
        <p>Please keep hitting refresh and eventually this message will change.
        <!--<p><strong>Total Hits from Redis:</strong> {visits}</p>-->
    </body>
    </html>
kubernetesClusterDomain: cluster.local
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""
tlcAlpineApp:
  app:
    env:
      configmapName: html-output-config
      redisHost: redis-master.flux-system.svc.cluster.local
    image:
      repository: localhost:5000/tlc-alpine-app
      tag: latest
    imagePullPolicy: Always
  nginx:
    image:
      repository: nginx
      tag: 1.25-alpine
  nodeSelector: {}
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
  type: ClusterIP
