# Global and default configurations for the tlc-alpine-app chart

replicaCount: 1

image:
  app:
    repository: localhost:5000/tlc-alpine-app
    tag: latest
    pullPolicy: Always
  nginx:
    repository: nginx
    tag: 1.25-alpine
    pullPolicy: IfNotPresent

rbac:
  create: true
  serviceAccountName: configmap-writer-sa
  roleName: configmap-writer-role
  bindingName: configmap-writer-binding

redis:
  host: "flux-system-redis-master.flux-system.svc.cluster.local"
  secretName: flux-system-redis
  secretKey: redis-password

configMap:
  name: html-output-config
  # Initial default index.html content
  defaultHtml: |
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TLC Alpine App</title>
        <style>
            body { font-family: sans-serif; background-color: #f4f4f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .card { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
            h1 { color: #0076ff; margin-bottom: 0.5rem; }
        </style>
    </head>
    <body>
        <h1>Hello from inside TLC Alpine App!</h1>
        <p>This HTML is still the default gh action/k8s deployment generated ConfigMap.</p>
        <p>The python generated configmap will take 1 to 2 minutes to sync automagically after container start, please be patient</p>
        <p>Please keep hitting refresh and eventually this message will change.
        <!--<p><strong>Total Hits from Redis:</strong> {visits}</p>-->
    </body>
    </html>

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
