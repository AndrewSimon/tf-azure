# headlam-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  releaseName: headlamp
  interval: 5m
  targetNamespace: kube-system
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
  values:
    config:
      pluginsDir: /headlamp/plugins
    image:
      repository: headlamp-k8s/headlamp
      tag: latest
    config:
      secretName: headlamp
    service:
      type: NodePort                        # Changes the service type to NodePort
      nodePort: 30443
    # Persistence for plugins
    persistentVolumeClaim:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClassName: standard
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /headlamp/plugins
    volumes:
      - name: headlamp-plugins
        persistentVolumeClaim:
          claimName: headlamp