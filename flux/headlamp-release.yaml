# headlam-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  releaseName: headlamp
  interval: 5m
  targetNamespace: kube-system
  chart:
    spec:
      chart: headlamp
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
  values:
    config:
      pluginsDir: /headlamp/plugins
    # Init container to copy the Flux plugin into a shared plugin directory
    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /headlamp/plugins && cp -vr /plugins/* /headlamp/plugins/ && chown -vR 100:101 /headlamp
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /headlamp/plugins
    containers:
    - name: headlamp
      image: ghcr.io/kubernetes-sigs/headlamp:latest
      args:
        - '-plugins-dir=/headlamp/plugins'         
    image:
      repository: headlamp-k8s/headlamp
      tag: latest
    config:
      secretName: headlamp
    service:
      type: NodePort                        # Changes the service type to NodePort
      nodePort: 30443
    # Persistence for plugins
    persistentVolumeClaim:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClassName: standard
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /headlamp/plugins
    volumes:
      - name: headlamp-plugins
        persistentVolumeClaim:
          claimName: headlamp