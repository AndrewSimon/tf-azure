# flux-plugin-deployment.yaml
# Init container to install the Flux plugin
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
  values:
    config:
      pluginsDir: /build/plugins
    # Init container to copy the Flux plugin into a shared plugin directory
    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -vr /plugins/* /build/plugins/ && chown -vR 100:101 /build && sleep 300
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    containers:
    - name: headlamp
      image: ghcr.io/kubernetes-sigs/headlamp:latest
      args:
        - '-plugins-dir=/build/plugins'
    # Volume for plugins shared between init and main containers
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
