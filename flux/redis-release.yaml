# redis-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: flux-system
spec:
  targetNamespace: flux-system
  interval: 5m
  chart:
    spec:
      chart: redis
      version: 18.x.x
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      enabled: true
      existingSecret: "redis" 
    image:
      # Flux will parse the comments below and automatically replace these lines
      repository: redis # {"$imagepolicy": "flux-system:redis-policy:repository"}
      tag: 7.2.4 # {"$imagepolicy": "flux-system:redis-policy:tag"}
