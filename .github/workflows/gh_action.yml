name: 'Terraform Plan via Python'
# v1
on: [push]

permissions:
  id-token: write # Required for Azure OIDC authentication
  contents: read  # Required to checkout the code

env:
  # Pass Azure credentials as environment variables for Terraform's AzureRM provider
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  GH-PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  ARM_USE_OIDC: "true"

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: public
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies to be able to test function_app.py build 
        run: |
          python -m pip install --upgrade pip
          pip install urllib3 PyJWT cryptography azure-identity azure-mgmt-compute azure-mgmt-network azure-mgmt-resource azure-functions azure-keyvault-secrets
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt
          # Install the Microsoft package repository GPG key
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg

          # Add the official Microsoft APT source list for Ubuntu
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/dotnetdev.list'

          # Update APT and install the latest Core Tools (v4)
          sudo apt-get update
          sudo apt-get install azure-functions-core-tools-4
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # Set to false so Python can parse raw stdout/stderr

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          environment: azurecloud
          allow-no-subscriptions: true
       
      - name: Verify Login (Show Azure Account Details)
        run: |
          az account show

      # Initialize the working directory containing configuration files
      - name: Terraform Init
        id: init
        run: terraform init
# This step needed when we need a new function app upload
#      - name: Terraform Destroy terraform_data.upload_function
#        id: delete-upload-function
#        run: terraform destroy -refresh=false -auto-approve -var=token=${{ secrets.PERSONAL_ACCESS_TOKEN }} -var=adminpass=${{ secrets.ADMIN_PASSWORD }} -target=terraform_data.upload_function
      - name: Terraform Apply and Python Build
        id: apply
        run: |
          touch function_app.py
          terraform apply -auto-approve -var=token=${{ secrets.PERSONAL_ACCESS_TOKEN }} -var=adminpass=${{ secrets.ADMIN_PASSWORD }}
      
      # NEVER cat or otherwise display function_app.py as it contains secrets
      - name: Test function_app.py
        id: test
        run: |
          python function_app.py  
      
  complete-lifecycle:
    #runs-on: ubuntu-latest # For GH Runners, not self-hosted
    runs-on: self-hosted
        # Sets the execution time limit for this specific job to 1 hour
    timeout-minutes: 60 # A way to controi costs
    continue-on-error: true # ALL jobs need this to reach runner hook's lifecycle
    environment: public 
#    permissions:
#      id-token: write # Required for OIDC authentication
#      contents: read
    steps:
      - name: Run bash shell and print a command out (Install and configure k3s)
        continue-on-error: true 
        shell: bash
        run:  |
               date
               # K8s port for .kube/config
               # sudo firewall-cmd --permanent --add-port=6443/tcp
               # Standard HTTPS Port
               # sudo firewall-cmd --permanent --add-port=443/tcp
               # NodePort patch for headlamp service
               # sudo firewall-cmd --permanent --add-port=30443/tcp
               # sudo firewall-cmd --reload
               # TOKEN=$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
               IP=$(curl -s  -H "Metadata: true"  "http://169.254.169.254/metadata/loadbalancer?api-version=2020-10-01" | jq -r '.loadbalancer.publicIpAddresses[0].frontendIpAddress')
               export FQDN=tlc.eastus2.cloudapp.azure.com
               echo "Configuring Kubernetes access to IP address $IP with HTTPS access via $FQDN"
               curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x ./kubectl && sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
               curl -sfL https://get.k3s.io | sh -s - server --tls-san $IP
               # curl -sfL https://get.k3s.io | sh -s - server
               sudo systemctl start k3s
               systemctl status k3s.service
               sudo mkdir /root/.kube /home/azureuser/.kube/ || true
               sudo cp /etc/rancher/k3s/k3s.yaml /root/.kube/config
               sudo cp /etc/rancher/k3s/k3s.yaml /home/azureuser/.kube/config
               sudo chown -R azureuser:azureuser /home/azureuser/.kube
               # Make k3s.yaml available for download to end-user
               sudo cp /etc/rancher/k3s/k3s.yaml /tmp
               # Make users' k3s.yaml use public IP
               sudo sed -i "s/127.0.0.1/$IP/g" /tmp/k3s.yaml
               sudo chmod 777 /tmp/k3s.yaml
               # Ready node takes ~30 seconds 
               sleep 15
               sudo bash -c "/usr/local/bin/kubectl get node"
               [ ! -f "/usr/sbin/helm" ] && curl -C - -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
               chmod 777 get_helm.sh
               [ ! -f "/usr/sbin/helm" ] && ./get_helm.sh ||true
     

      - name: Install Helm
        continue-on-error: true
        id: helm-install  
        shell: bash
        run:  |     
              sudo apt-get install curl gpg apt-transport-https --yes
              curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | sudo tee /usr/share/keyrings/helm.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list
              sudo apt-get update -y && sudo apt-get -y install helm    

      - name: Run Headlamp install
        continue-on-error: true
        id: headlamp-step      
        shell: bash
        run:  |
               export FQDN=tlc.eastus2.cloudapp.azure.com
               /usr/sbin/helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ 
               /usr/sbin/helm repo update
               /usr/sbin/helm upgrade --install headlamp headlamp/headlamp --namespace kube-system --set service.type=NodePort --set service.port=80
               /usr/local/bin/kubectl patch svc headlamp -n kube-system --type='json' -p='[{"op": "replace", "path": "/spec/ports/0/nodePort", "value": 30443}]'
               echo "Copy and paste the following on your local device command-line:"
               echo "mkdir ~/.kube ; scp azureuserr@$FQDN:/tmp/k3s.yaml ~/.kube/config"
               echo "kubectl create token headlamp --namespace kube-system"
               echo "Copy the token created from above command, using a browser navigate to http://$FQDN:30443, and paste it into token text box"
               exit 0

      - name: Install Docker CE
        shell: bash
        run: |
               date
               id
               set -e # Exit immediately with any non-0 exit


               echo "========================================="
               echo "   Installing Docker on Ubuntu Server    "
               echo "========================================="

               # 1. Update the apt package index and install prerequisites
               echo "--> Updating package index and installing prerequisites..."
               sudo apt-get update -y
               sudo apt-get install -y ca-certificates curl gnupg

               # 2. Add Docker's official GPG key
               echo "--> Adding Docker's official GPG key..."
               sudo install -m 0755 -d /etc/apt/keyrings
               curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
               sudo chmod a+r /etc/apt/keyrings/docker.gpg

               # 3. Set up the Docker repository
               echo "--> Setting up the Docker repository..."
               echo \
                 "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                 $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                 sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

               # 4. Update the package index again with Docker packages included
               echo "--> Updating package index with Docker repository..."
               sudo apt-get update -y

               # 5. Install Docker Engine, CLI, containerd, and Docker Compose
               echo "--> Installing Docker packages..."
               sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

               # 6. Verify the installation
               echo "--> Verifying installation..."
               sudo docker --version
               sudo docker compose version

               echo "========================================="
               echo "      Docker Installed Successfully      "
               echo "========================================="

               # 7. Post-installation step to run Docker without sudo
               echo "--> Adding $USER to the docker group..."
               sudo usermod -aG docker azureuser
               newgrp docker

               docker --version
      
      - name: Make workdir, create Dockerfile, build our app container 
        shell: bash
        run: | 
               mkdir alpine-build && cd alpine-build
               echo "FROM alpine:latest" > Dockerfile
               echo "RUN apk add --no-cache bash" >> Dockerfile
               echo "CMD [\"/bin/bash\"]" >> Dockerfile
               sudo docker build -t tlc-alpine-app .
               # Show new container is alpine, not ubuntu server
               sudo docker run --rm tlc-alpine-app cat /etc/os-release               
               
      - name: Run sleep 30 minutes to keep runner up
        continue-on-error: true
        id: sleep-step      
        shell: bash
        run:  sleep 1800
       
#  Lifecycle termination of node at job completion is an 'administrator' function controlled
#  via ACTIONS_RUNNER_HOOK_JOB_COMPLETED and not available to workflows for 'security reasons' 