apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: redis
  namespace: flux-system
spec:
  image: index.docker.io/library/redis
  interval: 5m0s
  # Optional: use provider or secretRef if pulling from a private registry
  # provider: generic
  # secretRef:
  #   name: redis-registry-credentials
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: redis
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: redis
  policy:
    semver:
      range: '7.x.x' 
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system # Change to your target namespace if different
spec:
  interval: 2h0m0s
  url: https://bitnami.com
