apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: tlc
spec:
  interval: 10m
  releaseName: redis
  targetNamespace: tlc # The namespace where Redis will be installed
  chart:
    spec:
      chart: redis
      version: "19.x" # Pin to a major version to safely allow patch updates
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: tlc
  values:
    # Custom Helm overrides go here
    architecture: standalone # Options: standalone or replication
    auth:
      enabled: true
      # It is best practice to pass existing secrets for passwords,
      # but Bitnami will auto-generate one if left blank.
