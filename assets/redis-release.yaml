# redis-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-release
spec:
  interval: 5m
  chart:
    spec:
      chart: redis
      version: 18.x.x
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    image:
      # Flux will parse the comments below and automatically replace these lines
      repository: docker.io/library/redis # {"$imagepolicy": "flux-system:redis-policy:repository"}
      tag: 7.2.4 # {"$imagepolicy": "flux-system:redis-policy:tag"}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'chore: update redis to {{ (getPolicy "flux-system:redis-policy").LatestImage }}'
  update:
    path: ./redis-release.yaml # Path targeting where redis-release.yaml resides
    strategy: Setters